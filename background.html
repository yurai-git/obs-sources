<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Background</title>
    <link rel="icon" href="./assets/images/favicon.svg" />
    <link rel="stylesheet" href="./assets/stylesheets/design-tokens.css" />
    <style>
      * {
        user-select: none;
      }
      html {
        font-size: 24px;
      }
      body {
        margin: 0;
      }
      body, .background {
        background-color: var(--md-sys-color-surface);
      }
      .background {
        inset: 0;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div class="background" />
  </body>
</html>
